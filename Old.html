<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloom & Vine | Beijing Duck & Modern Chinese Dining | Mountain View</title>
  <meta name="description" content="Experience modern Chinese dining at Bloom & Vine in downtown Mountain View. Signature Peking duck carved hourly, handmade soup dumplings, Sichuan flavors, and floral cocktails. Reservations & takeout available.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a3c34;
      --accent: #c9a227;
      --accent-light: #e8d48b;
      --bg: #faf8f5;
      --text: #2c2c2c;
      --muted: #6b6b6b;
      --white: #ffffff;
      --shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
    }
    h1, h2, h3, .logo {
      font-family: 'Playfair Display', Georgia, serif;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; height: auto; display: block; }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(26, 60, 52, 0.95);
      backdrop-filter: blur(10px);
      padding: 0.9rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--white);
    }
    .logo span { color: var(--accent); }
    nav { display: flex; gap: 1.8rem; align-items: center; }
    nav a {
      color: rgba(255,255,255,0.9);
      font-size: 0.95rem;
      font-weight: 500;
    }
    nav a:hover { color: var(--accent); }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: var(--primary);
      padding: 0.7rem 1.5rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background: var(--accent-light);
    }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
    }
    .btn-outline:hover {
      background: var(--accent);
      color: var(--primary);
    }

    .hero {
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(26,60,52,0.85) 0%, rgba(26,60,52,0.6) 100%),
                  url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--white);
      padding: 6rem 1.5rem 4rem;
    }
    .hero-content { max-width: 800px; }
    .hero h1 {
      font-size: clamp(2.8rem, 6vw, 4.2rem);
      font-weight: 700;
      margin-bottom: 0.8rem;
      line-height: 1.15;
    }
    .hero .tagline {
      font-size: 1.25rem;
      opacity: 0.95;
      margin-bottom: 0.5rem;
    }
    .hero .sub {
      font-size: 1.05rem;
      opacity: 0.85;
      margin-bottom: 2rem;
    }
    .hero-ctas { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .hero-badge {
      display: inline-block;
      background: rgba(201,162,39,0.2);
      border: 1px solid var(--accent);
      color: var(--accent-light);
      padding: 0.35rem 1rem;
      border-radius: 50px;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
    }

    section { padding: 5rem 5%; }
    .container { max-width: 1100px; margin: 0 auto; }
    .section-title {
      text-align: center;
      font-size: 2.4rem;
      margin-bottom: 0.6rem;
      color: var(--primary);
    }
    .section-sub {
      text-align: center;
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto 3rem;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: center;
    }
    .about-text p { margin-bottom: 1.2rem; color: var(--muted); }
    .about-text h3 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 1rem;
    }
    .highlights {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .highlight {
      background: var(--white);
      padding: 1rem;
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-size: 0.95rem;
    }
    .
